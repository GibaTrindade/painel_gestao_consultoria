{% if form.errors %}
<div class="form-error-summary" role="alert">
    <strong>Confira os campos para continuar.</strong>
    <ul>{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}</ul>
</div>
{% endif %}
